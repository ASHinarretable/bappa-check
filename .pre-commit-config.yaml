# Dogfooding: this repo checks itself with its own hook.
#
# Uses `repo: local` for now since this repo isn't tagged yet (it's pushed,
# but there's no `vX.Y.Z` release for a `rev:` to pin to). Once tagged,
# switch to:
#
#   repos:
#     - repo: https://github.com/ASHinarretable/bappa-check
#       rev: v0.1.0
#       hooks:
#         - id: bappa-check
#
# which is also exactly what other projects would put in their own
# .pre-commit-config.yaml to use bappa-check.
repos:
  - repo: local
    hooks:
      - id: bappa-check
        name: Bappa Check
        entry: bappa-check
        language: system
        pass_filenames: true
        require_serial: true
        verbose: true
        # tests/ deliberately contains fake secrets (to test the secrets
        # detector), and PLAN.md / README.md document the exact patterns we
        # check for -- all three are expected to "fail" a real scan. Standard
        # practice: every secret-scanner excludes its own test fixtures/docs.
        exclude: ^(tests/.*|PLAN\.md|README\.md)$
