name: Publish to PyPI

# Triggers on any `vX.Y.Z` tag push. Uses PyPI's Trusted Publishing (OIDC) --
# no API token stored in secrets. One-time setup required before this can
# succeed: on pypi.org, add a "Trusted Publisher" for this repo pointing at
# this workflow file, with environment name "pypi" (see PLAN.md, Phase 7).

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install build

      - name: Build sdist + wheel
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
