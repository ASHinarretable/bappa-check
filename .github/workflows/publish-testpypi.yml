name: Publish to TestPyPI (dry run)

# Manual only -- click "Run workflow" in the Actions tab. Never triggers on
# push/tag, so a dry run can never accidentally hit the real index.
#
# Uses TestPyPI's own Trusted Publishing (OIDC), separate from the real
# PyPI one in publish.yml. One-time setup required before this can succeed:
# on test.pypi.org, add a "Trusted Publisher" for this repo pointing at
# this workflow file, with environment name "testpypi" (see PLAN.md,
# Phase 7). TestPyPI accounts are separate from real PyPI accounts.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install build

      - name: Build sdist + wheel
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # required for TestPyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
